<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Big Bass - Clicker exempel</title>
</head>

<body>
    <div class="hero1">
    <div class="cloud">
        <img src="img/cloud.png" class="cloud">
        <img src="img/cloud.png" class="cloud">
    </div>
            <div class="ocean">
                

                <div class="water">
                    <img src="img/water.png" alt="water1">
                    
                </div>

                <div class="water2">
                    <img src="img/water3.png" alt="water2">
                </div>

                
                
                <div class="boat">
                    <div class="game-controls">
        
                        <button id="game-button">Fiska</button>
                </div>
                    <img src="img/boat.png" alt="boat">
                </div>
                
        </div>

    </div>
    <audio id="reeling" src="audio/607251__d4xx__swoosh-2.wav"></audio>
    <header class="hero">
        
        <div class="hero-gradient"></div>
        <div class="container hero-content">
            
            
            <div class="lead">
                
        </div>
        
    </header>
    <main class="container">
        <article class="game">
            <div class="game-hud">
                <ul class="game-currency">
                    <li class="item">
                        <h3>Fiskar: <span id="money"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Fiskar per klick: <span id="mpc"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Fiskar per sekund: <span id="mps"></span></h3>
                    </li>
                    <li class="item">
                        <h3>Mer fiskeprylar: <span id="upgrades"></span></h3>
                    </li>
                </ul>
              
            </div>
            <div class="w-100">
                <h2>Fiskeprylar</h2>
                <div id="upgradelist"></div>
            </div>
            <div id="msgbox"></div>

        </article>
    </main>
    
    <script src="js/clicker.js" defer></script>
</body>

</html>
